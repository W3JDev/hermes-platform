services:
  # ── 1. OpenMuse Main Frontdoor (Hyper-Proactive Autonomous Agent) ───────────
  openmuse-frontdoor:
    build:
      context: ./openmuse-frontdoor
      dockerfile: Dockerfile
    container_name: hermes-openmuse-frontdoor
    restart: unless-stopped
    ports:
      - "${FRONTDOOR_PORT:-8787}:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - AGENT_BACKEND=hermes
      - WORKSPACE_MODE=${WORKSPACE_MODE:-sample}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - OPENMUSE_ACCESS_KEY=${OPENMUSE_ACCESS_KEY}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - CPK_INTELLIGENCE_API_KEY=${CPK_INTELLIGENCE_API_KEY}
      - BROWSER_WORKER_URL=${WORKER_URL:-http://openmuse-worker:8790}
      - HERMES_GATEWAY_URL=http://hermes-core:8642
      - HERMES_PROFILE=default
      - WORKER_URL=http://openmuse-worker:8790
      - WORKER_TOKEN=${WORKER_TOKEN}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_BASE_URL=${MINIMAX_BASE_URL}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENCOMPUTER_API_KEY=${OPENCOMPUTER_API_KEY:-}
      - OPENCOMPUTER_PROJECT_ID=${OPENCOMPUTER_PROJECT_ID:-}
      - DATA_DIR=/data
    volumes:
      - openmuse_data:/data
    depends_on:
      - hermes-core
      - openmuse-worker
    networks:
      - hermes-net

  # ── 2. OpenMuse Browser Worker (Computer Use & Web Exploration) ─────────────
  openmuse-worker:
    build:
      context: ./openmuse-frontdoor/apps/worker
      dockerfile: Dockerfile
    container_name: hermes-openmuse-worker
    restart: unless-stopped
    environment:
      - WORKER_HOST=0.0.0.0
      - WORKER_TOKEN=${WORKER_TOKEN}
      - WORKER_DATA_DIR=/data
    volumes:
      - worker_data:/data
    networks:
      - hermes-net

  # ── 3. Hermes Web Companion (Desktop App UI in Browser / PWA) ───────────────
  hermes-companion:
    build:
      context: ./hermes-companion
      dockerfile: Dockerfile
    container_name: hermes-companion
    restart: unless-stopped
    ports:
      - "${COMPANION_PORT:-8088}:80"
    depends_on:
      - hermes-core
    networks:
      - hermes-net

  # ── 4. Official Nous Hermes Agent Core (Gateway + Dashboard) ────────────────
  hermes-core:
    build:
      context: ./hermes-core
      dockerfile: Dockerfile
    container_name: hermes-core
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8642}:8642"
      - "${DASHBOARD_PORT:-9119}:9119"
    environment:
      - HOME=/home/hermes
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-hermes-admin-2026}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - hermes_home:/home/hermes/.hermes
      - hermes_data:/home/hermes/data
      - ./hermes-core/agent-config.yaml:/home/hermes/.hermes/config.yaml:ro
    networks:
      - hermes-net

  # ── 5. Hermes Enterprise Platform (GenUI Canvas & Workspace) ────────────────
  hermes-enterprise:
    build:
      context: ./hermes-enterprise
      dockerfile: Dockerfile
    container_name: hermes-enterprise
    restart: unless-stopped
    ports:
      - "${ENTERPRISE_PORT:-8001}:8001"
    depends_on:
      postgres-hub:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-hermes-db-secret}@postgres-hub:5432/hermes_enterprise
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL}
      - ENVIRONMENT=production
    networks:
      - hermes-net

  # ── 6. Voice Gateway (MiniMax TTS & Grok Voice) ─────────────────────────────
  voice-gateway:
    build:
      context: .
      dockerfile: voice-gateway/Dockerfile
    container_name: hermes-voice-gateway
    restart: unless-stopped
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_GROUP_ID=${MINIMAX_GROUP_ID:-}
      - PORT=8202
    networks:
      - hermes-net

  # ── 7. PostgreSQL 16 with pgvector ─────────────────────────────────────────
  postgres-hub:
    image: pgvector/pgvector:pg16
    container_name: hermes-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      - POSTGRES_DB=hermes_enterprise
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hermes_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-net

  # ── 8. Redis State & Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6382}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge

volumes:
  openmuse_data:
  worker_data:
  hermes_home:
  hermes_data:
  postgres_data:
  redis_data:
